<!DOCTYPE html>
<html>
<head>
  <title>Bank AI Assistant</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #f5f5f7; }
    h1 { font-size: 20px; }
    #chat { background: white; border-radius: 12px; padding: 16px; min-height: 300px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .msg { padding: 10px 14px; margin: 8px 0; border-radius: 10px; max-width: 80%; }
    .user { background: #007aff; color: white; margin-left: auto; text-align: right; }
    .assistant { background: #e9e9eb; color: #111; white-space: pre-wrap; font-family: monospace; font-size: 13px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ccc; }
    button { padding: 12px 20px; border-radius: 8px; border: none; background: #007aff; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🏦 Bank Customer Support Assistant</h1>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="Ask about your account..." autocomplete="off" />
    <button type="submit">Send</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');

    function addMessage(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      addMessage(message, 'user');
      input.value = '';

      const res = await fetch('http://localhost:8000/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, account_id: 'AC001' })
      });
      const data = await res.json();
      addMessage(JSON.stringify(data.response, null, 2), 'assistant');
    });
  </script>
</body>
</html>
